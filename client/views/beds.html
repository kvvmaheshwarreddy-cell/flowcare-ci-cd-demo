<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
  <div><h1 class="h2 mb-0">Beds and wards</h1><p class="page-sub mb-0">{{vm.can ? 'Click a bed to change its status.' : 'View only.'}}</p></div>
  <div class="d-flex flex-wrap gap-1"><fc-pill ng-repeat="s in vm.statuses" value="{{s}}" label="{{s}} · {{vm.count(s)}}"></fc-pill></div>
</div>
<div class="panel p-3 mb-3" ng-repeat="d in vm.departments">
  <div class="d-flex justify-content-between mb-2"><h2 class="h6 mb-0">{{d.name}}</h2><span class="small page-sub num">{{(vm.inDept(d) | filter:{status:'occupied'}).length}}/{{vm.inDept(d).length}} occupied</span></div>
  <div class="row g-2">
    <div class="col-4 col-md-2 col-xl-1" ng-repeat="b in vm.inDept(d)">
      <div class="dropdown">
        <div class="bed-tile bed-{{b.status}}" data-bs-toggle="{{vm.can ? 'dropdown' : ''}}">
          <div class="fw-semibold num">{{b.label}}</div><div class="text-capitalize page-sub">{{b.status}}</div>
        </div>
        <ul class="dropdown-menu" ng-if="vm.can">
          <li ng-repeat="s in vm.statuses" ng-if="s !== b.status"><a class="dropdown-item text-capitalize" href="" ng-click="vm.set(b, s)">Mark {{s}}</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
