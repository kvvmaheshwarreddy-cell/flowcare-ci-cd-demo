<div class="login-wrap px-3">
  <div class="panel p-4 p-md-5" style="max-width: 420px; width: 100%">
    <div class="brand text-dark mb-4" style="color: var(--fc-ink) !important"><span class="brand-mark">+</span> FlowCare</div>
    <h1 class="h3">Sign in</h1>
    <p class="page-sub">Hospital operations and resource optimisation.</p>
    <form ng-submit="vm.submit()" class="mt-3">
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" ng-model="vm.form.email" required /></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" ng-model="vm.form.password" required /></div>
      <div class="alert alert-danger py-2" ng-if="vm.error">{{vm.error}}</div>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
    <div class="mt-4 small page-sub">Demo accounts (password <code>Password123!</code>):</div>
    <div class="d-flex flex-wrap gap-1 mt-2">
      <button class="btn btn-sm btn-outline-secondary" ng-repeat="u in vm.demo" ng-click="vm.pick(u)">{{u}}</button>
    </div>
  </div>
</div>
