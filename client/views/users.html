<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
  <div><h1 class="h2 mb-0">User management</h1><p class="page-sub mb-0">Self-registered accounts start as receptionists.</p></div>
  <button class="btn btn-primary" ng-click="vm.showForm = !vm.showForm"><i class="bi bi-plus"></i> Add user</button>
</div>
<form class="panel p-3 mb-3" ng-if="vm.showForm" ng-submit="vm.add()">
  <div class="row g-2">
    <div class="col-md-3"><input class="form-control" ng-model="vm.form.name" placeholder="Name" required /></div>
    <div class="col-md-3"><input class="form-control" type="email" ng-model="vm.form.email" placeholder="Email" required /></div>
    <div class="col-md-2"><input class="form-control" type="password" minlength="8" ng-model="vm.form.password" placeholder="Password" required /></div>
    <div class="col-md-2"><select class="form-select" ng-model="vm.form.role" ng-options="r as vm.labels[r] for r in vm.roles"></select></div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Create</button></div>
  </div>
</form>
<div class="panel table-responsive">
  <table class="table mb-0 align-middle">
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr></thead>
    <tbody><tr ng-repeat="u in vm.users">
      <td class="fw-medium">{{u.name}}</td><td>{{u.email}}</td>
      <td><select class="form-select form-select-sm" style="max-width:200px" ng-model="u.role" ng-change="vm.update(u, {role: u.role})" ng-disabled="u._id === vm.me.id" ng-options="r as vm.labels[r] for r in vm.roles"></select></td>
      <td><div class="form-check form-switch"><input class="form-check-input" type="checkbox" ng-model="u.active" ng-disabled="u._id === vm.me.id" ng-change="vm.update(u, {active: u.active})" /></div></td>
    </tr></tbody>
  </table>
</div>
