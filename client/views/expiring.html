<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
  <div><h1 class="h2 mb-0">Expiring inventory</h1><p class="page-sub mb-0">Expired batches are excluded from usable stock automatically.</p></div>
  <select class="form-select w-auto" ng-model="vm.days" ng-change="vm.load()" ng-options="d as ('Next ' + d + ' days') for d in [7, 30, 60, 90]"></select>
</div>
<div class="panel table-responsive">
  <table class="table mb-0 align-middle">
    <thead><tr><th>Item</th><th>Batch</th><th>Location</th><th>Qty</th><th>Expiry</th><th>Status</th></tr></thead>
    <tbody>
      <tr ng-repeat="b in vm.batches">
        <td><a href="/inventory/items/{{b.item._id}}">{{b.item.name}}</a></td><td class="num">{{b.batchNo}}</td><td>{{b.location}}</td>
        <td class="num">{{b.quantity}} {{b.item.unit}}</td><td>{{b.expiryDate | date:'mediumDate'}}</td>
        <td><fc-pill value="{{b.expired ? 'expired' : 'warning'}}" label="{{b.expired ? 'expired' : 'expiring'}}"></fc-pill></td>
      </tr>
      <tr ng-if="!vm.batches.length"><td colspan="6" class="text-center py-4 page-sub">Nothing expiring in this window.</td></tr>
    </tbody>
  </table>
</div>
